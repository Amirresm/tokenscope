<html>
  <head>
    <title>Token Inspector</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div id="app">
      <h1 class="title">Token Inspector</h1>
      <textarea id="prompt" class="input-text" type="text" placeholder="Prompt"></textarea>
      <input id="max" type="text" placeholder="Max tokens" value="100" />
      <button id="button">Generate</button>
      <p id="info" class="output-paragraph"></p>
      <p id="state" class="output-paragraph"></p>
    </div>
    <script src="index.js"></script>
  </body>
</html>
